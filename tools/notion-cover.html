<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* 1500×600 Notion cover. Notion crops top/bottom on wide screens, so key content sits in the middle band. */
*{margin:0;box-sizing:border-box}
body{width:1500px;height:600px;background:#3A2012;color:#F5ECE0;position:relative;overflow:hidden;font-family:"IBM Plex Mono",monospace}
.grid{position:absolute;inset:0;background:
  linear-gradient(#F5ECE0,#F5ECE0) 0 120px/100% 2px no-repeat,
  linear-gradient(#F5ECE0,#F5ECE0) 0 478px/100% 2px no-repeat;opacity:.9}
.slash{position:absolute;left:60px;top:176px;width:760px;height:22px;background:#B65C3C;transform:skewY(-2.2deg)}
.slash2{position:absolute;left:770px;top:162px;width:70px;height:6px;background:#B65C3C;transform:skewY(-2.2deg)}
h1{position:absolute;left:56px;top:206px;font:400 200px/.9 Anton,sans-serif;text-transform:uppercase;letter-spacing:.005em}
h1 em{font-style:normal;color:#B65C3C}
.k{position:absolute;font-size:16px;letter-spacing:.16em;text-transform:uppercase}
.k1{left:60px;top:76px}.k2{right:60px;top:76px}.k3{left:60px;top:500px}.k4{right:60px;top:500px;color:#E8D9C5}
.logo{position:absolute;right:60px;top:150px;height:300px;width:auto}
.rule{position:absolute;right:360px;top:120px;width:2px;height:360px;background:#F5ECE0}
.idx{position:absolute;left:60px;top:150px;font:400 300px/.8 Anton;color:transparent;-webkit-text-stroke:2px #F5ECE0}
</style></head><body>
<div class="grid"></div>
<div class="k k1">GC Home Base</div><div class="k k2">Saskatoon · YXE</div>
<div class="slash"></div><div class="slash2"></div>
<h1>Home <em>Base</em></h1>
<div class="rule"></div>
<img class="logo" src="../assets/logo/gods-chai-logo-reverse.png" alt="">
<div class="k k3">Kadak. Every single cup.</div><div class="k k4">Not your average chai</div>
</body></html>
